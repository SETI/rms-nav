# Simulated observation configuration. Mirrors the per-camera schema
# of the real instrument blocks so the sim path can be navigated without
# branching the orchestrator on observation type.
#
# This block serves the instrument-agnostic ('generic') sim frame. When a
# scene names an instrument, the physical parameters (read noise, saturation,
# marker, units, thresholds) delegate to that instrument's config_4N0 block;
# only the sim-only knobs here (signal_full_scale_frac, cosmic_ray_rate_per_sec,
# pixel_area_cm2, missing_data_rate) continue to apply.
sim:
  data_units: raw_dn
  extfov_margin_vu: [50, 50]
  star_psf_sigma: 1.
  star_psf_sizes:
    100: [11, 11]
  fit_camera_rotation: false
  max_rotation_deg: 5.0
  noise:
    saturation_dn: 4095            # 12-bit synthetic detector
    full_well_dn: 4095
    expected_noise_dn: 1.0
    marker_value: 0
    read_noise_dn: 1.0
    # Fraction of the instrument's full well that a normalized signal of 1.0
    # maps to, so brightness scales with the selected camera's DN depth.
    signal_full_scale_frac: 0.5
    # Detector-noise defaults; scenes may override via a 'noise' block. Poisson
    # shot noise is on by default; cosmic rays and dropouts are off by default.
    cosmic_ray_rate_per_sec: 0.0   # events / cm^2 / sec
    pixel_area_cm2: 1.0
    missing_data_rate: 0.0         # fraction of pixels marked missing
    bloom_length: 0                # column-bloom half-length, px (0 = no bloom)
  image_quality_thresholds:
    blank_max_dn: 5.0
    saturation_threshold_dn: 4095
    noisy_threshold_dn: 10.0
    max_missing_frac_clean: 0.30
    max_overexposed_frac_clean: 0.80
  source_image_filter:
    kind: BANDPASS_DOG
    lo_sigma_px: 5.0
    hi_sigma_px: 0.7
    enabled: false
  mag_offset:
    fallback_combo: 'CL'
    mag_offset_table:
      'CL': {default: 0.0}
