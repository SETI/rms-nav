# Bootstrap technique parameters. All angle-valued fields are degrees per
# the project-wide rule that YAML angles are in degrees; loaders convert
# at load time. Resolutions are pixel-grid pitches, not pixel counts.
bootstrap:
  bootstrap_min_body_area: 100
  body_list:
    - DIONE
    - ENCELADUS
    - IAPETUS
    - MIMAS
    - RHEA
    - TETHYS
  min_confidence: 0.1
  min_area: 16384
  max_phase_angle_deg: 135.0
  max_incidence_angle_deg: 70.0
  max_emission_angle_deg: 70.0
  lon_resolution_deg: 0.5
  lat_resolution_deg: 0.5
  latlon_type: centric
  lon_direction: east
  min_coverage_frac: 0.1
  max_subsolar_dist_deg: 45.0
  max_res_factor: 3
