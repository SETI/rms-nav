# Voyager ISS per-camera configuration. 8-bit cameras; noise and
# image-quality threshold values carry `# PLACEHOLDER` markers until
# phase-10 calibration finalizes them.
voyager_iss:
  data_units: calibrated_if
  extfov_margin_vu:
    1000: [400, 400]
  star_psf_sigma: 3.
  star_psf_sizes:
    100: [7, 7]
  fit_camera_rotation: false        # TODO-Voyager ISS carries non-negligible attitude rotation residuals
  max_rotation_deg: 5.0
  noise:
    saturation_dn: 255             # 8-bit ADC
    full_well_dn: 255
    expected_noise_dn: 1.0         # PLACEHOLDER — calibrate in Phase 10
    marker_value: 0
    read_noise_dn: 1.0             # PLACEHOLDER — calibrate in Phase 10
  image_quality_thresholds:
    blank_max_if: 1.0e-4            # PLACEHOLDER — calibrate in Phase 10
    noisy_threshold_if: 0.005       # PLACEHOLDER — calibrate in Phase 10
    max_missing_frac_clean: 0.30
    max_overexposed_frac_clean: 0.80
  source_image_filter:
    kind: BANDPASS_DOG
    lo_sigma_px: 5.0
    hi_sigma_px: 0.7
    enabled: false
  mag_offset:
    fallback_combo: 'CL'
    mag_offset_table:
      'CL': {default: 0.0}         # PLACEHOLDER — calibrate in Phase 10
