# Logging configuration.
#
# Two loggers exist.  The main logger covers one program run and reports what
# the program is doing at the top level.  The image logger covers one image
# inside one per-image backend and carries that image's processing detail.
#
# Each logger writes to a console sink, a file sink, or both.  Both sinks
# always share a level, so one level per module governs whatever sinks happen
# to be enabled.  Whether a logger reaches the terminal is settable here and on
# the command line, which wins; whether it writes a file is command-line only,
# being inseparable from where that file goes.
#
# Levels are DEBUG, INFO, WARNING, ERROR, CRITICAL, and NONE.

logging:

  # Raise, rather than warn, when a component scoped to one image logs while no
  # image scope is open.  That situation is a programming error either way;
  # warning keeps one mis-scoped call from aborting a batch over a log line.
  # Turn this on to make such a call fail loudly instead.
  strict_scope: false

  # Global default for each logger.
  main: INFO
  image: INFO

  # Whether each logger reaches the terminal.  The main log carries what the
  # run is doing and is worth watching; an image log carries one image's
  # detail, which is usually wanted in a file rather than interleaved on
  # screen, so it is off by default.  --log-main-to-console and
  # --log-image-to-console (and their --no- forms) override these per run.
  #
  # A cloud-task worker ignores both: its console belongs to the queue.
  main_console: true
  image_console: false

  # Per-module overrides.  A module with no entry here follows the "image"
  # level above, so nothing is listed that would only restate it: writing
  # "default: INFO" in a category would shadow "image", and a later
  # "image: DEBUG" would then silently fail to reach that category.  A
  # category's "default" is for deliberately holding one category away from
  # the image level.
  #
  # Technique and model keys are the snake_case form of the class name with the
  # NavTechnique / NavModel prefix, a trailing Nav, and a trailing Simulated
  # removed, so TitanHazeNav is "titan_haze" and both NavModelRings and
  # NavModelRingsSimulated are "rings".
  techniques: {}
  models: {}

  # Image-scoped components that are neither a technique nor a model:
  # annotate, correlate, ensemble, image_derivatives, obs, orchestrator and
  # provenance.  A component appears here only once it opens a section of its
  # own, since that is where a level is applied.  There is no key for a
  # per-image backend: a backend's verbosity is the "image" level of whichever
  # program drives it.
  other:
    annotate: ERROR

  # Per-program overrides, keyed by program identity (see
  # spindoctor/config/program_names.py).  A block accepts any key above except
  # strict_scope, and wins over the global value for that program only:
  #
  #   programs:
  #     sd_mosaic:
  #       main: WARNING
  #       image: DEBUG
  #       image_console: true
  programs: {}
