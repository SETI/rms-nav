# Galileo SSI per-camera configuration. Single 8-bit camera; the noise
# and image-quality threshold values are starting points carrying
# `# PLACEHOLDER` markers until phase-10 calibration finalizes them.
galileo_ssi:
  data_units: raw_dn
  extfov_margin_vu: [350, 350]
  star_psf_sigma: 3.
  star_psf_sizes:
    100: [7, 7]
  # Galileo SSI carries non-negligible attitude rotation residuals, and they
  # are deliberately left unfitted, because a fitted rotation is not currently
  # a well-defined quantity.  Each technique rotates about its own centre --
  # the DT techniques about a vertex centroid, the disc about a composite
  # centroid, the star fits about a weighted catalog centroid -- and a rotation
  # by theta about pivot P differs from the same rotation about pivot Q by the
  # translation (I - R(theta))(P - Q).  Techniques describing one physical
  # twist therefore report different translations, which the ensemble then
  # fuses as though they were comparable; for a fraction of a degree across a
  # couple of hundred pixels of pivot separation that is of order a pixel.
  # A fitted rotation also cannot be carried into a corrected attitude, so it
  # suppresses the corrected C-matrix and omits the frame from every corrected
  # kernel.  With fitting off the twist is absorbed into the reported
  # translation, as it already is for every other instrument.  Issue #434 is
  # the standing account and proposes fitting about the FOV centre instead.
  fit_camera_rotation: false
  max_rotation_deg: 5.0
  noise:
    saturation_dn: 255             # 8-bit ADC
    full_well_dn: 255
    expected_noise_dn: 1.0         # PLACEHOLDER — calibrate in Phase 10
    marker_value: 0
    read_noise_dn: 1.0             # PLACEHOLDER — calibrate in Phase 10
    # interim: photometric zero point (DN a vmag-0 star deposits per second),
    # the electron zero point over the standard gain state.
    star_flux_dn_per_s_vmag0: 2.14e4
  image_quality_thresholds:
    blank_max_dn: 5.0              # PLACEHOLDER — calibrate in Phase 10
    saturation_threshold_dn: 255   # 8-bit ADC
    noisy_threshold_dn: 10.0       # PLACEHOLDER — calibrate in Phase 10
    max_missing_frac_clean: 0.30
    max_overexposed_frac_clean: 0.80
  source_image_filter:
    kind: BANDPASS_DOG
    lo_sigma_px: 5.0
    hi_sigma_px: 0.7
    enabled: false
  mag_offset:
    fallback_combo: 'CL'
    mag_offset_table:
      'CL': {default: 0.0}         # PLACEHOLDER — calibrate in Phase 10
