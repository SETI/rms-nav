# Orchestrator-level acceptance parameters: the ensemble combine and the
# per-feature-type reliability gate.
#
# Every value here mirrors the code default (DEFAULT_* constants in
# spindoctor.nav_orchestrator.ensemble and
# spindoctor.feature.reliability); the section exists so calibration
# sweeps and user config files can override them without code changes.
#
# The tier min_confidence boundaries are SIM-ANCHORED (calibrated
# against simulated planted-truth recovery only; see the provenance
# note in config_510_techniques.yaml): derived 2026-07-18 from the
# recalibrated campaign's fused results (util/calibration, campaign
# seed 20260718 on the staged forward-model renderer with the full
# surface / photometric truth axes and the ring truth vocabulary;
# 3392 fused offsets, all #210 covariance floors live) as the
# smallest confidence at which the tier's sigma-gated subset achieves
# a 0.9 success rate against the tier's own error budget.
# max_sigma_px values are the tier definitions, not fitted.
# - high: 0.85 (success 0.932 at sigma <= 0.5 px, err <= 0.5 px; the
#   0.55-0.80 bands measure 0.874-0.8999, under target -- the ring
#   family's planted orbit errors put tight-sigma confidently-wrong
#   locks in the mid-confidence band, failure mass no ring diagnostic
#   can see, so the boundary sits where the measured curve actually
#   clears 0.9).
# - medium: the sigma <= 2.0 px gate carries the discrimination by
#   itself (success 0.92+ at every measured confidence band), so the
#   boundary rests at the same floor as the low tier and the final
#   gate; the tiers are sigma-differentiated, which is what
#   max_sigma_px is for.
# min_confidence 0.35: the fused fit rate (err <= 3 px) measures
# 0.35-0.40 in the 0.10-0.15 bands and 0.89 at 0.35, with almost no
# probability mass in between (n < 15 per 0.05 band in 0.20-0.30) --
# the crossing is bounded inside (0.15, 0.35] and the gate takes the
# measured upper edge.  Everything else remains subject to empirical
# calibration.
# Every floored technique's 2-sigma coverage sits at 0.86-0.87 against
# the 0.865 reference (util/calibration/fit_floors verification); the
# NCC techniques' size-scaled covariance terms over-cover slightly
# (0.93-0.95), and StarUniqueMatchNav's CRLB-only sigma measures 0.85.
orchestrator:
  ensemble:
    # Mahalanobis-distance threshold for grouping per-technique results.
    agreement_sigma: 2.0
    # Euclidean translation-distance fallback grouping threshold (px).
    agreement_pixel_floor: 5.0
    # Minimum summed-confidence gap between best and runner-up groups
    # before declaring a conflict.  Absolute when the runner-up has a
    # quorum (two or more members); in a lone-vs-lone standoff the gap
    # is measured relative to the winner (conflict only when
    # best - runner_up < agreement_gap * best), so an excluded
    # low-confidence dissenter cannot veto a clearly stronger singleton.
    agreement_gap: 0.5
    # Multiplier on combined confidence when more than one group existed.
    disagreement_penalty: 0.7
    # Additional multiplier when the conflicted branch fires.
    conflicted_confidence_multiplier: 0.3
    # Final-result threshold below which the ensemble returns failed.
    min_confidence: 0.35
    # rcond for scipy.linalg.pinvh.
    pinvh_rcond: 1.0e-9
    # Maximum |rotation| (deg) a 3-DoF result may take before rejection.
    max_allowed_rotation_deg: 5.0
    # Confidence/sigma requirements per confidence tier; max_sigma_px
    # null means no sigma requirement for that tier.
    tier_thresholds:
      high: {min_confidence: 0.85, max_sigma_px: 0.5}
      medium: {min_confidence: 0.35, max_sigma_px: 2.0}
      low: {min_confidence: 0.35, max_sigma_px: null}
  # Minimum reliability per feature type; features below their type's
  # threshold are gated out before any technique runs.  Feature types
  # not listed fall through with a 0.0 threshold (no gate).
  reliability_gate:
    STAR: 0.20
    LIMB_ARC: 0.30
    TERMINATOR_ARC: 0.30
    BODY_DISC: 0.30
    BODY_BLOB: 0.20
    RING_EDGE: 0.30
    RING_ANNULUS: 0.30
    CARTOGRAPHIC_MODEL: 0.30
    TITAN_LIMB: 0.30
