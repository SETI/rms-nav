titan:
  # Haze envelope above the solid radius, km. Bounds the search
  # annulus and windows; the fit itself does not assume a haze
  # altitude.
  atmosphere_height: 700
  navigation:
    # Hard-zero reliability floors: beyond these the feature is still
    # emitted but with reliability 0.0, so the standard TITAN_LIMB type
    # gate always removes it.
    min_envelope_diameter_px: 40.0
    max_occluded_fraction: 0.10
    ring_occlusion_radii_km: [74490.0, 140500.0]
    axis_min_offset_px: 3.0
    recenter_threshold_px: 8.0
    star_mask_vmag_limit: 8.0
    star_mask_radius_px: 4.0
    # Reliability sigmoid: chosen so reliability crosses the 0.30
    # TITAN_LIMB type gate near the hard-zero floor above, keeping the
    # two gates consistent.
    reliability_diameter_midpoint_px: 52.0
    reliability_diameter_scale_px: 14.0
    # Cassini filters that see through to the surface; sets the
    # surface_window flag (diagnostic + future refinement only).
    surface_window_filters: [CB3]
    symmetry:
      annulus_inner_fraction: 0.55
      annulus_outer_pad_px: 6.0
      angle_refine_deg: 5.0
      angle_refine_step_deg: 0.5
      angle_refine_min_gain: 0.02
      min_peak_score: 0.60
      min_valid_fraction: 0.50
      max_second_peak_ratio: 0.90
      # Set from the planted-truth campaign (util/titan_truth, 700 randomized
      # scenes, campaign seed 20260725).  The noise-deficit heuristic the
      # cross-track sigma comes from over-states the error by about an order
      # of magnitude on rendered haze discs: over the rows whose sigma was not
      # already clamped to the floor below, the multiplier that makes the
      # cross-track z-scores unit-normal measured 0.088, and 0.098 on the
      # preceding campaign draw -- 0.10 is the stable round value between them.
      #
      # The reported sigma barely moves, because the floor below binds on 94%
      # of rows either way -- which is also why the all-row z-score standard
      # deviation cannot reach the [0.8, 1.25] acceptance band at ANY value of
      # this scale: it saturates at 0.656 once every row sits on the floor.
      # Closing that gap needs sigma_floor_cross_px, which Phase E owns.
      cross_sigma_scale: 0.10
      sigma_floor_cross_px: 0.30
    arc:
      sector_half_angle_deg: 60.0
      ray_step_deg: 2.0
      radial_step_px: 0.5
      radial_inner_fraction: 0.80
      radial_outer_pad_px: 6.0
      median_filter_samples: 5
      min_gradient_snr: 4.0
      min_rays: 20
      min_inlier_fraction: 0.50
      max_residual_rms_px: 2.0
      tukey_c: 4.685
      # Held at unity by the planted-truth campaign, and deliberately NOT
      # retuned to satisfy the z-score band.  The few percent of rows whose
      # fit sigma exceeds the floor below are the rows where the arc fit
      # knows it did badly -- they carry the campaign's largest along-track
      # errors -- and on them the estimator reports sigma too NARROW, not too
      # wide (their own z-scores run to an rms near 3).  Shrinking this
      # multiplier would narrow the reported uncertainty on exactly the
      # frames that are wrong, buying a better-looking all-row statistic by
      # making the honest minority dishonest.
      #
      # The consequence is that the all-row along-track z-score standard
      # deviation sits below the [0.8, 1.25] band and no value of this
      # multiplier fixes it, for the same reason as the cross axis: the
      # floor below sets the reported sigma on ~97% of rows.  Only
      # sigma_floor_along_px can settle it, and that is Phase E's, with
      # real-frame evidence; the measured along-track rms is near 0.9 px.
      along_sigma_scale: 1.0
      sigma_floor_along_px: 1.00
