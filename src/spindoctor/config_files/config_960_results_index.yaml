# How much of a pass over a results tree runs at once.
#
# A pass over a cloud root is latency and not bandwidth: a listing is one round
# trip, a document is another, and a navigation document is a few kilobytes.
# Overlapping that latency is the difference between a routine re-ingest and one
# to plan around.
#
# The values below were tuned on one machine against one bucket, and the ceiling
# they found was that service's round trip on that day. They are a property of a
# machine and its network rather than of this program: a different provider, a
# link with more or less latency, a service with its own view on concurrent
# requests, or a local disk that pays no latency at all will want different
# numbers. Change them here for a machine that wants them.
results_index:
  # How many directories are listed at once.
  walk_threads: 32
  # How many directories one round of the walk takes off its frontier. This
  # bounds what a round holds rather than what it fetches, so it is about the
  # machine's memory and the tree's shape.
  walk_directories_at_once: 256
  # How many documents are fetched at once within one batch.
  retrieve_threads: 64
  # How many documents are retrieved in one batched download. Below
  # retrieve_threads the download pool cannot fill, which is refused at startup
  # rather than left to be measured.
  retrieve_batch_size: 1024
