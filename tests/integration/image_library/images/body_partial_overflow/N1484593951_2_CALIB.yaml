  notes: |
    Large Rhea partially visible continuing to the upper right.
    Good limb.  Body extractor reports overflow_fraction = 0.222
    (i.e. 22 % of the disc is off-frame), which sits below the
    BODY_DISC emission gate (overflow <= 0.3) so BodyDiscCorrelateNav
    runs on this image — and correctly flags itself spurious because
    the disc-template NCC peak collapses against the heavily-cropped
    silhouette.  BodyLimbNav converges to (12.06, 30.53) px, within
    the 1.0 px ground-truth uncertainty of the operator's (11.0,
    29.5).  BodyTerminatorNav runs but flags itself spurious (0 / 895
    inliers; LM did not iterate) so the spec's hard-zero gate forces
    its confidence to 0.  BodyLimbNav is therefore the only
    non-spurious technique and becomes the orchestrator's primary.

