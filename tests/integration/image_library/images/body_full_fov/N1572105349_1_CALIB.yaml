  notes: |
    Full-body view of Dione in the center.  Mostly lit with sliver
    of terminator in upper left.  Predicted diameter 155 px,
    overflow 0.0, visible-lit fraction 0.97 — textbook
    body-fills-FOV scenario.

    Phase-5 status: BodyDiscCorrelateNav converges to (9.17, -17.01),
    within 0.5 px of the operator's ground truth.  But the technique
    flags itself spurious=True because the pyramid wrapper's
    ``consistency`` (2.78 px disagreement between coarse and fine
    pyramid levels in the auto-gradient pass) exceeds the
    consistency_tol=2.0 threshold.  Gradient-mode picks a strong
    peak (quality 19.96) but the pyramid drift trips the spurious
    detector even though the final offset is correct.

    BodyLimbNav does NOT run because the reliability gate drops the
    LIMB_ARC feature.  The limb-reliability formula carries a
    ``-0.7 * mean_incidence_factor`` term where the incidence-factor
    cap is 4.76; on a fully-lit body the limb vertices live near
    80-90 deg incidence and the penalty saturates, dragging
    reliability to ~0.14, below the LIMB_ARC gate threshold (0.30).
    The textbook full-disc body's limb is rejected before BodyLimbNav
    can consume it.

    Phase 6 / Phase 10 follow-ups:

    1. Recalibrate the LIMB_ARC reliability formula so a fully-lit
       limb does not saturate the incidence-factor penalty.
       Candidates: lower the alpha on incidence_factor, replace the
       penalty with a per-vertex sigma_normal-weighted average that
       already encodes the photometric softness, or move the
       incidence-factor consideration entirely into sigma_normal_px
       (where it already lives) and drop it from reliability.
    2. Loosen ``consistency_tol`` for BodyDiscCorrelateNav (or apply
       it only when the auto-gradient picker swapped modes between
       pyramid levels), so a strong, consistent gradient-mode peak
       on a fully-in-FOV body does not get rejected for sub-3-px
       coarse-vs-fine drift.

    Today's behavior: status=failed (every technique spurious),
    primary_technique=BodyDiscCorrelateNav (only technique that ran,
    flagged spurious).

