schema_version: 1
scene_name: disc_subpixel_offset
instrument: coiss_nac
image_size_vu: [220, 220]
random_seed: 7
exposure_sec: 1.0
# Regression scene for the gradient-magnitude NCC sub-pixel bias surfaced by the
# disc offset sweep.  Both axes are planted at a whole-pixel offset, where the
# bias is largest (it recurs at every integer offset and vanishes at the
# half-pixel).  BodyDiscCorrelateNav should recover this to within a small
# fraction of a pixel; the gradient-magnitude sub-pixel refinement instead biases
# it by ~0.3 px per axis.  Guarding it here exercises the fix in the normal suite
# without running the full offset sweep.
bodies:
  - name: RHEA
    center_v: 110.0
    center_u: 110.0
    axis1: 90.0
    axis2: 90.0
    axis3: 90.0
    illumination_angle: 25.0
    phase_angle: 30.0
rings: []
noise:
  poisson: true
  read_noise_dn: 4.0
ground_truth:
  planted_offset_dv_px: 3.0
  planted_offset_du_px: 2.0
  planted_rotation_deg: 0.0
