schema_version: 2
scene_name: titan_crescent_horns
instrument: coiss_nac
size_v: 260
size_u: 260
random_seed: 7
exposure_sec: 1.0
bodies:
  - name: TITAN
    shape_model: ellipsoid
    center_v: 130.0
    center_u: 130.0
    axis1: 170.0
    axis2: 170.0
    axis3: 170.0
    illumination_angle: 90.0
    phase_angle: 155.0
    atmosphere:
      scale_height_px: 10.0
      tau_ref: 3.0
      ref_altitude_px: 0.0
      g: 0.75
noise:
  poisson: true
  read_noise_dn: 4.0
offset_v: 1.2
offset_u: -0.8
offset_rotation_deg: 0.0
# At 155 deg phase the forward-scattering haze defeats every body technique: the
# disc correlation is spurious (no full lit disc to correlate), and the ring of
# light drags the lit-weighted blob centroid ~30 px in du from the planted
# offset.  The predicted TERMINATOR_ARC is emitted but never fitted: with its
# honestly computed reliability (visible-arc fraction ~1.0, the albedo penalty,
# and the sin(155 deg) = 0.42 phase cap) it scores 0.26 against the 0.30
# TERMINATOR_ARC reliability gate, so BodyBlobNav is the only surviving
# technique and the fused answer is a low-tier success at the blob's 0.40
# confidence cap -- roughly 30 px wrong.  This is NOT a designed-safe outcome:
# no second technique remains to veto the haze-biased blob, the low tier (plus
# the provisional-confidence marker every sim-anchored result carries) is the
# only flag, and the deciding margin is thin -- reliability 0.26 vs the 0.30
# gate, both resting on uncalibrated defaults.  The confidence recalibration
# pass re-collects terminator rows against these honest inputs and will re-land
# this scene's expected outcome.
expected:
  status: success
  confidence_tier: low
