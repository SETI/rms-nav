schema_version: 2
scene_name: orbit_error_ringlet
instrument: coiss_nac
size_v: 220
size_u: 220
random_seed: 15
exposure_sec: 1.0
# The planted-ephemeris-error axis: a centred navigable ringlet whose
# rendered orbit is displaced 2.5 px outward of the catalog orbit the
# navigator predicts from (delta_a_px, a truth key).  A uniform radial
# misplacement has no exact translational equivalent, but the robust
# edge fit down-weights the far arc and locks onto one side of the
# annulus, absorbing the ephemeris error into the recovered offset
# instead of the residuals -- through 2026-07-18 that recovery fused as
# a CONFIDENT high-tier success (conf 0.89, sigma 0.17 px, ~3 px wrong),
# this scene's standing ensemble-gap evidence.
# Deliberate re-pin (2026-07-19): RingEdgeNav now consumes the declared
# sigma_a_px error bar -- the fully-correlated radial orbit uncertainty
# is added in quadrature to its reported covariance along the fit's
# radial direction -- so the fused sigma honestly widens (0.21, 0.53 px)
# and the sigma-gated tier demotes out of high to medium.  Measured
# outcome: success/medium at (-2.01, -1.87) px against the planted
# (1.0, -1.5), fused error 3.03 px, inside the unchanged pin band.  The
# offset bias itself remains (the technique still locks one-sided; the
# channel prices the error, it cannot remove it), so
# known_offset_error_px stays the honest hazard pin.  The fused scalar
# confidence now reads the 0.99 combined-confidence cap: widening the
# edge covariance balances the two members' precision weights, which
# unlocks the two-member agreement boost even though both techniques
# observe the same misplaced annulus -- the known correlated-error
# ensemble artifact (#222-family in the issue tracker), deliberately
# not asserted here; the sigma-gated tier carries the honest verdict.
expected:
  status: success
  confidence_tier: medium
  known_offset_error_px: 3.0
  known_offset_error_tol_px: 1.0
bodies: []
ring_system:
  geometry:
    center_v: 110.0
    center_u: 110.0
    opening_deg_obs: 90.0
    opening_deg_sun: 90.0
    node_deg: 0.0
  features:
    - name: MISPLACED
      kind: ringlet
      tau: 2.0
      width: 20.0
      navigable: true
      orbit: {a: 60.0, ae: 0.0, long_peri: 0.0, rate_peri: 0.0}
      orbit_error: {delta_a_px: 2.5}
      declared_orbit_sigma: {sigma_a_px: 2.5}
noise:
  poisson: true
  read_noise_dn: 4.0
offset_v: 1.0
offset_u: -1.5
offset_rotation_deg: 0.0
