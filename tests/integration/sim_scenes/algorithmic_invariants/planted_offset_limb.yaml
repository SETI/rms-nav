schema_version: 1
scene_name: planted_offset_limb
instrument: coiss_nac
image_size_vu: [220, 220]
random_seed: 7
exposure_sec: 1.0
# A well-resolved sphere at low-moderate phase (30 deg).  The simulated body
# emits a LIMB_ARC -- the silhouette boundary sampled into a vertex polyline with
# outward normals -- which BodyLimbNav fits against the image-edge distance
# transform to recover the planted offset.  The phase is low enough that most of
# the boundary is the sunward lit limb (a sharp image edge); above ~60 deg the
# boundary is mostly terminator and the model emits no limb (the body is then a
# blob).  The full ensemble still recovers via the disc correlation, so this
# scene doubles as a disc scene; the dedicated test pins BodyLimbNav to prove the
# limb path.
bodies:
  - name: RHEA
    center_v: 110.0
    center_u: 110.0
    axis1: 130.0
    axis2: 130.0
    axis3: 130.0
    illumination_angle: 25.0
    phase_angle: 30.0
rings: []
noise:
  poisson: true
  read_noise_dn: 4.0
ground_truth:
  planted_offset_dv_px: 1.43
  planted_offset_du_px: -0.61
  planted_rotation_deg: 0.0
