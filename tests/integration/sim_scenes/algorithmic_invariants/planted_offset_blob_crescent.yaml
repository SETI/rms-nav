schema_version: 1
scene_name: planted_offset_blob_crescent
instrument: coiss_nac
size_v: 128
size_u: 128
random_seed: 11
exposure_sec: 1.0
# A high-phase (120 deg) crescent.  The disc correlation is spurious -- there is
# no full lit disc to correlate -- so BodyBlobNav is the load-bearing technique,
# and the full ensemble falls to it.  The lit-weighted centroid is
# orientation-independent, which is why it is the right tool for a high-phase
# or chaotic-rotator body.  Recovering the planted offset here exercises the
# background-pedestal subtraction and the sky-noise threshold in BodyBlobNav:
# without them the thresholded observed centroid diverges from the model's
# continuous predicted centroid by several pixels at this phase.
bodies:
  - name: HYPERION
    shape_model: ellipsoid
    center_v: 64.0
    center_u: 64.0
    axis1: 60.0
    axis2: 60.0
    axis3: 60.0
    illumination_angle: 18.0
    phase_angle: 120.0
noise:
  poisson: true
  read_noise_dn: 4.0
offset_v: 1.43
offset_u: -0.61
offset_rotation_deg: 0.0
