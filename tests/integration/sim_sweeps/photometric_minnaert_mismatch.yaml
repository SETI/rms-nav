sweep_name: photometric_minnaert_mismatch
# Photometric-mismatch axis (Section 8): the navigator's disc template shades
# Lambert, and Minnaert at k = 1 is exactly Lambert (I = mu0), so k = 1 is the
# self-consistency floor.  The sweep walks minnaert_k down from 1.0, rendering a
# progressively limb-darkened disc the Lambert template does not predict; the
# recovered-offset error grows as the correlation peak degrades against the
# mismatched brightness profile.  Pinned to BodyDiscCorrelateNav.
base_scene: model_mismatch/minnaert_disc_base.yaml
parameters: [bodies.0.minnaert_k]
values: [1.0, 0.9, 0.8, 0.7, 0.6, 0.5]
technique: BodyDiscCorrelateNav
