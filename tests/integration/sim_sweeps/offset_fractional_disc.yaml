sweep_name: offset_fractional_disc
# Planted offset swept across a range of magnitudes with a variety of fractional
# parts -- sub-pixel through several pixels -- on a resolved body navigated by the
# disc correlation.  The NCC sub-pixel refinement carries a fraction-dependent
# bias (near-zero at the half-pixel, up to ~0.4 px elsewhere) that is independent
# of the offset magnitude: the gradient-magnitude pixel-locking the perfect
# mid-pixel invariant scenes did not expose.  Recovery stays well inside a pixel
# across the whole range.
base_scene: phase_sweep_regular_body/regular_sphere_base.yaml
parameters: [offset_v]
values: [0.31, 0.5, 0.87, 1.62, 2.5, 3.75, 5.5, 7.6, 9.93, 12.0]
