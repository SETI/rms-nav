sweep_name: offset_fractional_blob
# Planted offset swept across a range with a variety of fractional parts on a
# small body navigated by the blob centroid.  Within its capture range the
# lit-weighted centroid is quantization-free -- whole, near-boundary, and
# arbitrary-fraction offsets all recover to a few hundredths of a pixel, with no
# dependence on the fractional part.  The range is kept inside the predicted
# bbox: a blob is a small-offset technique, because beyond the bbox the body
# clips out of the centroid integration window (see the report).
base_scene: phase_sweep_regular_body/small_sphere_base.yaml
parameters: [offset_v]
values: [0.13, 0.62, 1.27, 1.95, 2.58, 3.41, 4.16, 4.87]
